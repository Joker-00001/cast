name: Build & Package APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Debug APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for direct download
        run: cp app/build/outputs/apk/debug/app-debug.apk XboxVideoCaster.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XboxVideoCaster-debug-apk
          path: XboxVideoCaster.apk
          retention-days: 14

      - name: Publish GitHub Release for Auto-Update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Xbox Video Caster v1.0.${{ github.run_number }}"
          body: "Mise à jour automatique générée par GitHub Actions (Build #${{ github.run_number }})."
          files: XboxVideoCaster.apk
          prerelease: false
